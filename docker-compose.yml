version: "3.7"
services:
  hivemetastore:
    image: postgres:11.5
    hostname: hivemetastore
    environment:
      POSTGRES_PASSWORD: new_password
    expose:
      - 5432
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      spark_net:
        ipv4_address: 172.28.1.4
    extra_hosts:
      - "master:172.28.1.1"
      - "worker1:172.28.1.2"
      - "worker2:172.28.1.3"
      - "zeppelin:172.28.1.5"
      - "livy:172.28.1.6"

  master:
    image: panovvv/hadoop-hive-spark:2.5.2
#    build: '../hadoop-hive-spark-docker'
    hostname: master
    depends_on:
      - hivemetastore
    environment:
      HADOOP_NODE: namenode
      HIVE_CONFIGURE: yes, please
      SPARK_PUBLIC_DNS: localhost
      SPARK_LOCAL_IP: 172.28.1.1
      SPARK_MASTER_HOST: 172.28.1.1
      SPARK_LOCAL_HOSTNAME: master
    expose:
      - 1-65535
    ports:
      # Spark Master Web UI
      - 8080:8080
      # Spark job Web UI: increments for each successive job
      - 4040:4040
      - 4041:4041
      - 4042:4042
      - 4043:4043
      # Spark History server
      - 18080:18080
      # YARN UI
      - 8088:8088
      # Hadoop namenode UI
      - 9870:9870
      # Hadoop secondary namenode UI
      - 9868:9868
      # Hive JDBC
      - 11000:10000
    volumes:
      - ./data:/data
      - ./dfs-master:/dfs
    networks:
      spark_net:
        ipv4_address: 172.28.1.1
    extra_hosts:
      - "worker1:172.28.1.2"
      - "worker2:172.28.1.3"
      - "hivemetastore:172.28.1.4"
      - "zeppelin:172.28.1.5"
      - "livy:172.28.1.6"


  worker1:
    image: panovvv/hadoop-hive-spark:2.5.2
#    build: '../hadoop-hive-spark-docker'
    hostname: worker1
    depends_on:
      - hivemetastore
    environment:
      SPARK_MASTER_ADDRESS: spark://master:7077
      SPARK_WORKER_PORT: 8881
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_PUBLIC_DNS: localhost
      SPARK_LOCAL_HOSTNAME: worker1
      SPARK_LOCAL_IP: 172.28.1.2
      SPARK_MASTER_HOST: 172.28.1.1
      HADOOP_NODE: datanode
    expose:
      - 1-65535
    ports:
      # Hadoop datanode UI
      - 9864:9864
      #Spark worker UI
      - 8081:8081
      # yarn worker UI
      - 8042:8042
    volumes:
      - ./data:/data
      - ./dfs-work1:/dfs
    networks:
      spark_net:
        ipv4_address: 172.28.1.2
    extra_hosts:
      - "master:172.28.1.1"
      - "worker2:172.28.1.3"
      - "hivemetastore:172.28.1.4"
      - "zeppelin:172.28.1.5"
      - "livy:172.28.1.6"

  worker2:
    image: panovvv/hadoop-hive-spark:2.5.2
#    build: '../hadoop-hive-spark-docker'
    hostname: worker2
    depends_on:
      - hivemetastore
    environment:
      SPARK_MASTER_ADDRESS: spark://master:7077
      SPARK_WORKER_PORT: 8882
      SPARK_WORKER_WEBUI_PORT: 8082
      SPARK_PUBLIC_DNS: localhost
      SPARK_LOCAL_HOSTNAME: worker2
      SPARK_LOCAL_IP: 172.28.1.3
      SPARK_MASTER_HOST: 172.28.1.1
      HADOOP_NODE: datanode
      HADOOP_DATANODE_UI_PORT: 9865
    expose:
      - 1-65535
    ports:
      # Hadoop datanode UI
      - 9865:9865
      # Spark worker UI
      - 8082:8082
      # yarn worker UI
      - 8041:8042
    volumes:
      - ./data:/data
      - ./dfs-work2:/dfs
    networks:
      spark_net:
        ipv4_address: 172.28.1.3
    extra_hosts:
      - "master:172.28.1.1"
      - "worker1:172.28.1.2"
      - "hivemetastore:172.28.1.4"
      - "zeppelin:172.28.1.5"
      - "livy:172.28.1.6"

  livy:
    image: panovvv/livy:2.5.2
#    build: '../livy-docker'
    hostname: livy
    depends_on:
      - master
      - worker1
      - worker2
    volumes:
      - ./livy_batches:/livy_batches
      - ./data:/data
    environment:
      - SPARK_MASTER=yarn
      # Intentionally not specified - if it's set here, then we can't override it
      # via REST API ("conf"={} map)
      # Can be client or cluster
#      - SPARK_DEPLOY_MODE=client

      - LOCAL_DIR_WHITELIST=/data/batches/
      - ENABLE_HIVE_CONTEXT=false
      # Defaults are fine for variables below. Uncomment to change them.
#      - LIVY_HOST=0.0.0.0
#      - LIVY_PORT=8998
    expose:
      - 1-65535
    ports:
      - 8998:8998
    networks:
      spark_net:
        ipv4_address: 172.28.1.6
    extra_hosts:
      - "master:172.28.1.1"
      - "worker1:172.28.1.2"
      - "worker2:172.28.1.3"
      - "hivemetastore:172.28.1.4"
      - "zeppelin:172.28.1.5"

  # postgres used by airflow
  postgres:
      image: postgres:9.6
      networks:
        spark_net:
          ipv4_address: 172.28.1.21
      volumes: 
          # Create Test database on Postgresql
          - ./docker-airflow/pg-init-scripts:/docker-entrypoint-initdb.d
      environment:
          - POSTGRES_USER=airflow
          - POSTGRES_PASSWORD=airflow
          - POSTGRES_DB=airflow
      ports:
          - "5432:5432"

  # airflow LocalExecutor
  airflow_webserver:
      image: kylg/docker-airflow-spark:latest
      restart: always
      networks:
        spark_net:
          ipv4_address: 172.28.1.22
      depends_on:
          - postgres
      environment:
          - LOAD_EX=n
          - EXECUTOR=Local
          - JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64/
          - HADOOP_USER_NAME=root
          - FERNET_KEY=RxMvZmS7-z3mm9Ilf1SsUm4ObGbpi3R5Qlz2yG1Fg9s=
      volumes:
          - ./airflow/dags:/usr/local/airflow/dags #DAG folder
          - ./airflow/logs:/usr/local/airflow/logs
          - ./airflow/config/airflow.cfg:/usr/local/airflow/airflow/airflow.cfg
      ports:
          - "8282:8282"
      command: webserver
      healthcheck:
          test: ["CMD-SHELL", "[ -f /usr/local/airflow/airflow-webserver.pid ]"]
          interval: 30s
          timeout: 30s
          retries: 3

  zeppelin:
    image: panovvv/zeppelin-bigdata:2.5.2
#    build: '../zeppelin-bigdata-docker'
    hostname: zeppelin
    depends_on:
      - master
      - worker1
      - worker2
      - livy
    volumes:
      - ./zeppelin_notebooks:/zeppelin_notebooks
      - ./data:/data
    environment:
      ZEPPELIN_PORT: 8890
      ZEPPELIN_NOTEBOOK_DIR: '/zeppelin_notebooks'
    expose:
      - 8890
    ports:
      - 8890:8890
    networks:
      spark_net:
        ipv4_address: 172.28.1.5
    extra_hosts:
      - "master:172.28.1.1"
      - "worker1:172.28.1.2"
      - "worker2:172.28.1.3"
      - "hivemetastore:172.28.1.4"
      - "livy:172.28.1.6"

  spline_arangodb:
    image: arangodb:3.7.10
    restart: always
    ports:
      - 8529:8529
    hostname: arangodb
    networks:
      spark_net:
        ipv4_address: 172.28.1.23   
    environment:
      ARANGO_NO_AUTH: 1

  spline_server:
    image: absaoss/spline-rest-server:0.6.0
    restart: always
    ports:
      - 28080:8080
    hostname: spline_server
    networks:
      spark_net:
        ipv4_address: 172.28.1.24
    command: >
      bash -c "
        until curl --output /dev/null --silent --get --fail http://arangodb:8529/_admin/server/availability
        do
          echo waiting for arango db
          sleep 3
        done
        echo downloading admin-cli &&
        curl -O -s https://repo1.maven.org/maven2/za/co/absa/spline/admin/0.6.0/admin-0.6.0.jar &&
        echo creating Spline database &&
        java -jar ./admin-0.6.0.jar db-init arangodb://arangodb:8529/spline -s &&
        echo starting Spline server &&
        catalina.sh run
      "
    environment:
      SPLINE_DATABASE_CONNECTION_URL: 'arangodb://arangodb:8529/spline'
      # by default /dev/random is used which may block
      CATALINA_OPTS: "-Dsecurerandom.source=file:/dev/./urandom -Djava.security.egd=file:/dev/./urandom"

  spline_ui:
    image: absaoss/spline-web-ui:0.6.0
    restart: always
    environment:
      # The consumer URL is used by the web browser
      SPLINE_CONSUMER_URL: 'http://localhost:28080/consumer'
      # by default /dev/random is used which may block
      CATALINA_OPTS: "-Dsecurerandom.source=file:/dev/./urandom -Djava.security.egd=file:/dev/./urandom"
    ports:
      - 28081:8080
    hostname: spline_ui
    networks:
      spark_net:
        ipv4_address: 172.28.1.25


networks:
  spark_net:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16